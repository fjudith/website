<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 764" width="700" height="764" role="img" aria-labelledby="ti de">
  <title id="ti">Les sept couches d'une plateforme agentique, vue isométrique</title>
  <desc id="de">Sept dalles isométriques empilées, de 01 Compute et inférence en bas à 07 Interface et surfaces en haut. Chaque dalle porte ses composants types, colorés selon leur nature : brique différenciante à construire, service managé, infrastructure, standard ouvert, surface utilisateur, composant émergent. Deux parois translucides longent la pile sur toute sa hauteur : A Sécurité et gouvernance, B Observabilité et évaluation.</desc>

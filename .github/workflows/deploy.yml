name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions needed by the GitHub Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    # The Docusaurus site lives in the me/ subdirectory.
    working-directory: me

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Served at https://fjudith.github.io/website/ — used by Docusaurus
      # and the Slidev build so asset paths resolve under the subdirectory.
      DOCUSAURUS_BASE_URL: /website/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: me/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        # Slidev builds a headless browser bundle; give scripts network access.
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: me/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

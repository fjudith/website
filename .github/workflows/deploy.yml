name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions needed by the GitHub Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    # The Docusaurus site lives in the workspaces/docusaurus/ subdirectory.
    working-directory: workspaces/docusaurus

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Served at https://fjudith.github.io/website/ — used by Docusaurus
      # and the Slidev build so asset paths resolve under the subdirectory.
      DOCUSAURUS_BASE_URL: /website/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version pinned via the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Single source of truth: keep CI on the same Node as local dev
          # (see .nvmrc) so pnpm resolves identical lockfiles.
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            workspaces/docusaurus/pnpm-lock.yaml
            workspaces/docusaurus/slides/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Slidev workspace dependencies
        # Decks are a separate pnpm workspace under slides/ with their own
        # (per-deck pinned) Slidev versions.
        working-directory: workspaces/docusaurus/slides
        run: pnpm install --frozen-lockfile

      - name: Build website
        # Slidev builds a headless browser bundle; give scripts network access.
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: workspaces/docusaurus/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
